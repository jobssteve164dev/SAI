name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: sai-agent-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@12.0.2

      - name: Require release tag to match package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e 'const p=require("./package.json"); if (process.env.RELEASE_TAG !== `v${p.version}`) { throw new Error(`Release tag ${process.env.RELEASE_TAG} must equal v${p.version}`) }'

      - name: Install dependencies
        run: npm ci

      - name: Verify package and project
        run: npm run check

      - name: Publish with npm Trusted Publishing
        run: npm publish
